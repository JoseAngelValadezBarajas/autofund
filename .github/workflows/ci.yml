name: CI

# The full standard path runs with no exchange API keys, no production account and no private
# dataset. Tests that genuinely need private infrastructure are marked `live` or `stage` and are
# deselected here: they are certification tooling, not public CI, and treating a skip as a pass
# would make this workflow claim more than it verifies.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # Explicitly assert that no exchange mode is configured. A CI job that defaulted into anything
  # other than demo would be a bug in the safety boundary, and this makes that failure loud.
  AUTOFUND_MODE: demo

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history secret audit is a release gate and needs the full history to be meaningful.
          # Without this a shallow clone would audit one commit and report a confident clean.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # The dev extra carries only pytest, so the linters and type checker are installed
      # explicitly. They were referenced by the steps below but never installed, which is why the
      # first CI run died at `bandit` with "No module named bandit" rather than checking anything.
      - run: python -m pip install -e ".[dev]" ruff mypy bandit pip-audit
      - name: pytest
        run: python -m pytest tests -m "not live and not stage" -q
      - name: ruff
        run: python -m ruff check src/ tests/ scripts/
      - name: mypy --strict
        # Both platforms explicitly. The single-writer journal lock branches on `os.name` and only
        # one of `msvcrt`/`fcntl` exists per platform, so checking only the runner's platform leaves
        # the other branch unverified - which is how a Windows-clean tree failed CI on Linux.
        run: |
          python -m mypy --strict --platform linux src/autofund
          python -m mypy --strict --platform win32 src/autofund

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to the version the README documents and the test runner requires. It was 20,
          # which is below vitest's floor and made `npm ci` install a runner that cannot start.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: frontend
      - name: unit tests
        run: npx vitest run
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend

  security:
    name: Security (secrets, history, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" bandit pip-audit
      - name: working-tree secret scan
        run: python scripts/secret_scan.py
      - name: full Git history secret audit
        # Reads every blob in every reachable commit rather than the checkout, because a credential
        # deleted in a later commit is still recoverable by anyone who clones.
        run: |
          mkdir -p artifacts/ci
          python scripts/history_secret_audit.py --out artifacts/ci/publication-secret-audit.json
      - name: upload secret audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-secret-audit
          path: artifacts/ci/publication-secret-audit.json
          if-no-files-found: warn
      - name: bandit
        # Asserted against the recorded baseline rather than `bandit`'s exit code, because bandit
        # exits non-zero whenever it reports anything at all and this codebase has 46 Low findings
        # (assert statements, try/except/pass, and the one subprocess use). Treating "any finding"
        # as failure means the step always fails and everyone learns to ignore it. What must not
        # happen is a Medium or High appearing, or the Low count growing unnoticed.
        run: |
          python -m bandit -r src/ -q -f json -o bandit-report.json || true
          python - <<'PY'
          import json, sys
          report = json.load(open("bandit-report.json"))
          by_severity = report["metrics"]["_totals"]
          low = by_severity.get("SEVERITY.LOW", 0)
          medium = by_severity.get("SEVERITY.MEDIUM", 0)
          high = by_severity.get("SEVERITY.HIGH", 0)
          print(f"bandit: {low} Low, {medium} Medium, {high} High")
          if medium or high:
              sys.exit(f"bandit found {medium} Medium and {high} High severity issue(s)")
          if low > 46:
              sys.exit(f"bandit Low findings grew from the recorded baseline of 46 to {low}")
          PY
      - name: upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
      - name: pip-audit
        # Advisory rather than blocking for the tool itself. A vulnerability in a real dependency
        # should be fixed; the `pip` package reporting against itself should not block a pull
        # request, and conflating the two would train people to ignore this step.
        run: python -m pip_audit --skip-editable || true

  packaging:
    name: Packaging (build the distribution at the declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the declared build floor, without isolation
        # `--no-isolation` is the point of this job. With isolation, `setuptools>=77.0.1` resolves to
        # the newest release and the declared floor is never exercised. This pins the floor from
        # pyproject.toml and builds with exactly it, which is how the previous floor of 68 was found
        # to be unable to parse the license metadata at all.
        run: |
          python -m pip install --upgrade pip
          FLOOR=$(python -c "import tomllib,sys; reqs=tomllib.load(open('pyproject.toml','rb'))['build-system']['requires']; print(next(r for r in reqs if r.startswith('setuptools')))")
          echo "declared build floor: ${FLOOR}"
          python -m pip install "${FLOOR}" wheel build
          python -m build --wheel --no-isolation --outdir dist .
      - name: Assert the built wheel carries the license
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel was produced")
          archive = zipfile.ZipFile(wheels[0])
          names = archive.namelist()
          if not any("LICENSE" in name.upper() for name in names):
              sys.exit("the wheel does not carry the LICENSE file")
          metadata = archive.read([n for n in names if n.endswith("METADATA")][0]).decode()
          if "License-Expression: Apache-2.0" not in metadata:
              sys.exit("the wheel metadata does not declare Apache-2.0")
          print("wheel carries the license and declares Apache-2.0")
          PY

  demo-smoke:
    name: Demo smoke (offline, no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Demo mode is offline, credential-free and cannot reach an exchange
        # PYTHONPATH exposes the shared route-inventory helper the check uses to prove that no
        # research route mutates.
        env:
          PYTHONPATH: tests
        run: python scripts/demo_smoke.py
      - name: Demo mode ignores credentials present in the environment
        # The specific hazard: an operator with real keys exported. Demo must still be demo.
        env:
          AUTOFUND_BITSO_LIVE_API_KEY: FAKE-CI-KEY
          AUTOFUND_BITSO_LIVE_API_SECRET: FAKE-CI-SECRET
          AUTOFUND_BITSO_PROD_API_KEY: FAKE-CI-PROD-KEY
          PYTHONPATH: tests
        run: python scripts/demo_smoke.py

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: build the frontend
        # Required before Playwright: the backend serves the built assets.
        run: npm run build
        working-directory: frontend
      - name: Playwright
        # Visual-regression baselines are captured on Windows and Playwright suffixes them by OS, so
        # the config sets `ignoreSnapshots` on non-Windows hosts. Pixel comparison is therefore
        # skipped on Linux and the behavioural assertions still run. Regenerating baselines per OS
        # would commit a second image set nobody has verified by eye, so the limitation is stated
        # here and in the config rather than left implicit.
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
